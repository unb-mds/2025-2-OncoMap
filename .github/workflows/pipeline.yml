name: Integração Contínua (CI)

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'

jobs:
  backend-verificacao:
    name: Backend - Lint e Testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Oncomap/backend

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: Oncomap/backend/package-lock.json

    - name: Instalar dependências
      run: npm ci

    - name: Verificar Estilo de Código (Lint)
      run: npm run lint

    - name: Rodar Testes
      run: npm test
      env:
        PORT: 3001
        NODE_ENV: test
        
        QUERIDO_DIARIO_API_URL: "https://queridodiario.ok.org.br/API"

        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEYS }} 

  frontend-verificacao:
    name: Frontend - Lint, Testes e Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Oncomap/frontend

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: Oncomap/frontend/package-lock.json

    - name: Instalar dependências
      run: npm ci

    - name: Rodar Lint Frontend
      run: npm run lint

    - name: Rodar Testes
      run: npm test
      env:
        CI: true 

    - name: Rodar Build de Produção
      run: npm run build