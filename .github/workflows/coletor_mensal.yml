name: Pipeline Mensal Completo OncoMap

on:
  # Roda automaticamente às 05:00 UTC do dia 1 de cada mês
  schedule:
    - cron: '0 5 1 * *'
  
  # Permite rodar manualmente para testes
  workflow_dispatch:

jobs:
  run-monthly-pipeline:
    runs-on: self-hosted
    
    # Define um tempo limite para evitar que o processo fique travado para sempre pagando horas
    timeout-minutes: 60 

    steps:
      # --- SETUP ---
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Oncomap/backend/package-lock.json

      - name: Instalar dependências
        run: |
          cd Oncomap/backend
          npm install

      # --- PASSO 1: COLETA ---
      - name: 1. Rodar Coletor Mensal
        run: |
          cd Oncomap/backend
          node src/scripts/monthly_collector.js
        env:
          # Variáveis de banco de dados
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

      # --- PASSO 2: ENRIQUECIMENTO (PDF) ---
      # Este script vai pegar as novas menções inseridas acima e tentar ler o PDF
      - name: 2. Rodar Enriquecimento PDF
        run: |
          cd Oncomap/backend
          node src/scripts/enrichment_pdf.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # CRUCIAL: Sua chave do Gemini precisa estar nos Secrets do GitHub
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}

      # --- PASSO 3: ENRIQUECIMENTO (TXT / Fallback) ---
      # Este script pega o que o PDF falhou ou pulou e tenta ler via TXT
      - name: 3. Rodar Enriquecimento TXT (Fallback)
        run: |
          cd Oncomap/backend
          node src/scripts/enrichment_txt.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
