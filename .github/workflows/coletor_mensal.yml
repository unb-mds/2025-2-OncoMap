name: Pipeline Mensal Completo OncoMap

on:
  # Roda automaticamente às 05:00 UTC (02:00 BRT) do dia 1 de cada mês
  schedule:
    - cron: '0 5 1 * *'
  
  # Permite rodar manualmente para testes
  workflow_dispatch:

jobs:
  run-monthly-pipeline:
    # --- MUDANÇA 1: USAR SUA MÁQUINA BRASILEIRA ---
    runs-on: self-hosted 
    
    # Aumentei o tempo limite para 360 min (6 horas) pois processamento de IA é lento
    timeout-minutes: 360 

    steps:
      # --- SETUP ---
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Oncomap/backend/package-lock.json

      - name: Instalar dependências
        run: |
          cd Oncomap/backend
          npm install
          # Garante que as libs específicas de PDF e IA estejam instaladas
          npm install pdf-parse tiktoken @google/generative-ai axios pg dotenv

      # --- PASSO 1: COLETA ---
      - name: 1. Rodar Coletor Mensal
        run: |
          cd Oncomap/backend
          node src/scripts/monthly_collector.js
        env:
          # Note: No self-hosted, ele vai tentar usar o .env local se existir,
          # mas as secrets do GitHub sobrescrevem. Isso é bom.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

      # --- PASSO 2: ENRIQUECIMENTO (PDF) ---
      - name: 2. Rodar Enriquecimento PDF (Processar Tudo)
        # --- MUDANÇA 2: ADICIONAR ARGUMENTOS ---
        # Passamos 1 até 1 milhão para garantir que ele pegue todos os novos registros
        run: |
          cd Oncomap/backend
          node src/scripts/enrichment_pdf.js 1 1000000
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}

      # --- PASSO 3: ENRIQUECIMENTO (TXT / Fallback) ---
      - name: 3. Rodar Enriquecimento TXT (Fallback para Tudo)
        run: |
          cd Oncomap/backend
          node src/scripts/enrichment_txt.js 1 1000000
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
