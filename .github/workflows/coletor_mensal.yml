name: Pipeline Mensal Completo OncoMap

on:
  schedule:
    - cron: '0 5 1 * *'
  
  workflow_dispatch:

jobs:
  run-monthly-pipeline:
    runs-on: [self-hosted, linux, x64]
    
    timeout-minutes: 360 

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Oncomap/backend/package-lock.json

      - name: Instalar dependências
        run: |
          cd Oncomap/backend
          npm install
          # Garante instalação das libs críticas
          npm install pdf-parse tiktoken @google/generative-ai axios pg dotenv

      - name: 1. Rodar Coletor Mensal
        run: |
          cd Oncomap/backend
          node src/scripts/monthly_collector.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: 2. Rodar Enriquecimento PDF (Processar Tudo)
        run: |
          cd Oncomap/backend
          # Passa intervalo grande para garantir que pegue todos os novos IDs
          node src/scripts/enrichment_pdf.js 1 1000000
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}

      - name: 3. Rodar Enriquecimento TXT (Fallback Geral)
        run: |
          cd Oncomap/backend
          # Passa intervalo grande para cobrir todo o banco
          node src/scripts/enrichment_txt.js 1 1000000
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
