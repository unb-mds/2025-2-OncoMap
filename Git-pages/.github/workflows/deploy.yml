name: Build and Deploy Hugo Site to GitHub Pages

on:
  push:
    branches:
      - main      
      # - gh-pages (Remova se você for deletar essa branch depois do merge)

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    
    steps:
      # 1. Checkout (Removemos o ref: gh-pages para pegar a branch atual que disparou o evento)
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: true 
          fetch-depth: 0

      # 2. Setup Hugo
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      # 3. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install requests

      # 4. Scripts (ADICIONAMOS 'cd Git-pages' antes de rodar ou ajustamos o caminho)
      # A maneira mais segura é entrar na pasta para garantir que os scripts achem os arquivos .json locais
      - name: Fetch Data Scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd Git-pages
          python ./scripts/fetch_issues.py
          python ./scripts/fetch_milestones.py
          python ./scripts/fetch_atas.py
          python ./scripts/fetch_doc.py

      # 5. Build Hugo (Precisamos dizer ao Hugo onde está a fonte com -s ou entrar na pasta)
      - name: Build Hugo Site
        run: hugo --minify --source Git-pages

      # 6. Deploy
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages-deploy
          # O diretório public agora será criado DENTRO de Git-pages
          publish_dir: ./Git-pages/public 
          commit_message: "Auto-deploy triggered by commit on ${{ github.ref_name }}"